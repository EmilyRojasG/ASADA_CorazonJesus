# ===============================
# NOMBRE DE LA APLICACIÓN
# ===============================
spring.application.name=ASADA_CorazonJesus

# ===============================
# PUERTO
# ===============================
# Se usa el puerto 8080 en lugar del 80 porque en Linux/macOS los puertos
# menores a 1024 requieren privilegios de administrador para poder usarse.
server.port=8080

# ===============================
# BASE DE DATOS
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/asada_cjesus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#mysql://avnadmin:AVNS_lwmJtxaff8LfARNHlw0@mysql-32419223-rojasemi0-99e4.c.aivencloud.com:19287/defaultdb?ssl-mode=REQUIRED
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuar1o_Clave.

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# A partir de Hibernate 6, el dialecto se detecta automáticamente a partir
# de la conexión JDBC, por lo que no es necesario declararlo manualmente.
spring.jpa.hibernate.ddl-auto=none

spring.jpa.open-in-view=false

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# SUBIDA DE IMÁGENES
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Carpeta local donde se guardan las imágenes de usuarios y abonados
# (Entrega 3 migrará este almacenamiento a Firebase Storage).
asada.upload.dir=uploads

# ===============================
# CODIFICACIÓN
# ===============================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true