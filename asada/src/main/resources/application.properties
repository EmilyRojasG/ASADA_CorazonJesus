# ===============================
# NOMBRE DE LA APLICACIÓN
# ===============================
spring.application.name=ASADA_CorazonJesus

# ===============================
# PUERTO
# ===============================
# Render (y la mayoría de plataformas de despliegue) asignan el puerto de
# forma dinámica mediante la variable de entorno PORT. En desarrollo local
# esa variable no existe, así que se usa 8080 como valor por defecto.
server.port=${PORT:8080}

# ===============================
# BASE DE DATOS
# ===============================
# Estos son los valores por defecto para desarrollo local. En producción
# (Render, con la base de datos en Aiven) NO se debe editar este archivo:
# basta con definir las variables de entorno SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD en el panel de
# Render, y Spring Boot las toma automáticamente con prioridad sobre lo
# que esté escrito aquí (no hace falta ninguna sintaxis especial).
#
# Para Aiven en particular, la URL JDBC normalmente necesita SSL, por
# ejemplo:
#   jdbc:mysql://<host>:<puerto>/<basededatos>?useSSL=true&requireSSL=true
# (la conexión real a Aiven se configurará más adelante).
spring.datasource.url=jdbc:mysql://mysql-32419223-rojasemi0-99e4.c.aivencloud.com:19287/defaultdb?useSSL=true&requireSSL=true&serverTimezone=UTC

spring.datasource.username=avnadmin
spring.datasource.password=AVNS_lwmJtxaff8LfARNHlw0

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# A partir de Hibernate 6, el dialecto se detecta automáticamente a partir
# de la conexión JDBC, por lo que no es necesario declararlo manualmente.
spring.jpa.hibernate.ddl-auto=none

spring.jpa.open-in-view=false

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# SUBIDA DE IMÁGENES
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Carpeta donde se guardan las imágenes de usuarios y abonados.
# ADVERTENCIA para Render: el sistema de archivos de un servicio web en
# Render es EFÍMERO -- cualquier archivo escrito en disco (como estas
# imágenes) se PIERDE en cada reinicio o nuevo despliegue, a menos que se
# agregue un "Persistent Disk" en Render (apuntando ASADA_UPLOAD_DIR a esa
# ruta montada) o se migre a Firebase Storage (planeado para más
# adelante). Localmente esto no es un problema.
asada.upload.dir=${ASADA_UPLOAD_DIR:uploads}

# ===============================
# ALMACENAMIENTO DE IMÁGENES (local o Firebase)
# ===============================
# "local" (por defecto) guarda las imágenes en disco (ver advertencia
# arriba sobre Render). Para usar Firebase Storage, define estas
# variables de entorno en Render (NO las escribas aquí, y mucho menos
# subas el JSON de la cuenta de servicio al repositorio):
#
#   ASADA_STORAGE_PROVIDER=firebase
#   FIREBASE_STORAGE_BUCKET=<tu-bucket>.appspot.com
#   FIREBASE_CREDENTIALS_JSON=<contenido completo del .json de la cuenta de servicio>
#
# (alternativa a FIREBASE_CREDENTIALS_JSON: FIREBASE_CREDENTIALS_PATH,
# apuntando a un "Secret File" de Render con ese mismo contenido).
asada.storage.provider=${ASADA_STORAGE_PROVIDER:local}
asada.firebase.bucket-name=${FIREBASE_STORAGE_BUCKET:}
asada.firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
asada.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# ===============================
# CODIFICACIÓN
# ===============================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true