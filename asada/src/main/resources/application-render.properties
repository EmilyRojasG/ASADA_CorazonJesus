# ===============================
# Perfil "render" (producción)
# ===============================
# Se activa definiendo la variable de entorno SPRING_PROFILES_ACTIVE=render
# en el panel de Render. No cambia la conexión a base de datos (eso se
# sigue resolviendo con SPRING_DATASOURCE_URL/USERNAME/PASSWORD como
# variables de entorno); solo ajusta comportamientos que deben ser
# distintos entre desarrollo local y producción.

# En producción no se debe recompilar plantillas en cada request: se
# cachean para mejor rendimiento.
spring.thymeleaf.cache=true

# Menos ruido en los logs de producción.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.web=warn
