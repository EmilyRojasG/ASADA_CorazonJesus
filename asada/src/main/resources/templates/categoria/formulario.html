<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Categoría tarifaria | ASADA</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container py-4">

            <div th:replace="~{layout/mensajes :: mensajes}"></div>

                <div class="row justify-content-center">
                    <div class="col-md-7">

                        <div class="card shadow-sm">
                            <div class="card-header bg-primary text-white">
                                <h4 class="mb-0">
                                    <i class="bi bi-cash-coin"></i>
                                    <span th:text="${categoriaTarifa.idCategoriaTarifa != null ? 'Modificar categoría tarifaria' : 'Nueva categoría tarifaria'}"></span>
                                </h4>
                            </div>
                            <div class="card-body">

                                <form th:action="@{/categoria_tarifa/guardar}" th:object="${categoriaTarifa}" method="post">

                                    <input type="hidden" th:field="*{idCategoriaTarifa}">

                                    <div class="mb-3">
                                        <label class="form-label">Descripción</label>
                                        <input type="text" class="form-control" th:field="*{descripcion}"
                                               th:classappend="${#fields.hasErrors('descripcion') ? 'is-invalid' : ''}"
                                               maxlength="60" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Tarifa base (₡)</label>
                                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{tarifaBase}"
                                                   th:classappend="${#fields.hasErrors('tarifaBase') ? 'is-invalid' : ''}" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('tarifaBase')}" th:errors="*{tarifaBase}"></div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Precio por m³ (₡)</label>
                                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{precioM3}"
                                                   th:classappend="${#fields.hasErrors('precioM3') ? 'is-invalid' : ''}" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('precioM3')}" th:errors="*{precioM3}"></div>
                                        </div>
                                    </div>

                                    <div class="form-check form-switch mb-4">
                                        <input class="form-check-input" type="checkbox" role="switch" th:field="*{activo}" id="activo">
                                        <label class="form-check-label" for="activo">Categoría activa</label>
                                    </div>

                                    <div class="d-flex justify-content-between">
                                        <a href="/categoria_tarifa/listado" class="btn btn-outline-secondary">
                                            <i class="bi bi-arrow-left"></i>
                                            Regresar
                                        </a>
                                        <button type="submit" class="btn btn-success">
                                            <i class="bi bi-check-lg"></i>
                                            Guardar
                                        </button>
                                    </div>

                                </form>

                            </div>
                        </div>

                    </div>
                </div>

        </div>

    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/main.js}"></script>

</body>

</html>
