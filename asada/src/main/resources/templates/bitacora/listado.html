<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bitácora de auditoría | ASADA</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container py-4">

            <div th:replace="~{layout/mensajes :: mensajes}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">
                    <i class="bi bi-journal-text text-primary"></i>
                    Bitácora de auditoría
                </h2>
                <a href="/actividad/listado" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Regresar a actividades
                </a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">

                    <div th:if="${entradas == null or entradas.empty}" class="text-center text-muted py-4">
                        Todavía no hay movimientos registrados en la bitácora.
                    </div>

                    <div class="table-responsive" th:if="${entradas != null and !entradas.empty}">
                        <table class="table table-striped align-middle">
                            <thead>
                                <tr>
                                    <th>Fecha y hora</th>
                                    <th>Acción</th>
                                    <th>Actividad</th>
                                    <th>Motivo</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="e : ${entradas}">
                                    <td th:text="${#temporals.format(e.fechaAccion, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <span class="fw-semibold" th:text="${e.descripcionAccion}"></span>
                                    </td>
                                    <td th:text="${e.descripcionActividad}"></td>
                                    <td th:text="${e.motivo != null ? e.motivo : '—'}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>

    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/main.js}"></script>

</body>

</html>
