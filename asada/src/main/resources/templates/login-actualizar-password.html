<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Actualizar contraseña | ASADA</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

</head>

<body class="login-body">

    <main class="container">

        <div class="row justify-content-center align-items-center"
             style="min-height: 100vh;">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow p-4 login-card">

                    <div class="text-center mb-4">

                        <img th:src="@{/img/logo.svg}" alt="Logo ASADA" class="login-logo">

                        <h2 class="fw-bold mt-3">
                            Actualizar contraseña
                        </h2>

                        <p class="text-muted mb-0">
                            Ingrese su usuario y contraseña actual para definir una nueva.
                        </p>

                    </div>

                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/login/actualizar-password}" method="post">

                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                <input type="text" class="form-control" id="username" name="username"
                                       th:value="${username}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="passwordActual" class="form-label">Contraseña actual</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="passwordActual" name="passwordActual" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="passwordNueva" class="form-label">Nueva contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                                <input type="password" class="form-control" id="passwordNueva" name="passwordNueva"
                                       minlength="6" required>
                            </div>
                            <div class="form-text">Mínimo 6 caracteres.</div>
                        </div>

                        <div class="mb-4">
                            <label for="passwordConfirmar" class="form-label">Confirmar nueva contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                                <input type="password" class="form-control" id="passwordConfirmar" name="passwordConfirmar"
                                       minlength="6" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-check-lg"></i>
                            Actualizar contraseña
                        </button>

                    </form>

                    <div class="text-center mt-3">
                        <a href="/login" class="small">
                            <i class="bi bi-arrow-left"></i>
                            Volver al inicio de sesión
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </main>

    <script src="/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

</body>

</html>
