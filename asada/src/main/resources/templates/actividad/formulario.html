<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${actividad != null ? 'Modificar actividad | ASADA' : 'Nueva actividad | ASADA'}">Actividad | ASADA</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container py-4">

            <div th:replace="~{layout/mensajes :: mensajes}"></div>

            <div class="row justify-content-center">
                <div class="col-md-7">

                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">
                                <i class="bi bi-tools"></i>
                                <span th:text="${actividad != null ? 'Modificar actividad' : 'Nueva actividad'}"></span>
                            </h4>
                        </div>
                        <div class="card-body">

                            <form th:action="@{/actividad/guardar}" method="post" id="formActividad"
                                  onsubmit="return confirm((document.getElementById('idActividad').value ? '¿Está seguro de guardar los cambios de esta actividad?' : '¿Confirma registrar esta actividad?'));">

                                <input type="hidden" id="idActividad" name="idActividad"
                                       th:if="${actividad != null}" th:value="${actividad.idActividad}">

                                <div class="mb-3" th:if="${actividad != null}">
                                    <label class="form-label">
                                        Motivo de la edición
                                        <span class="text-danger">*</span>
                                    </label>
                                    <textarea class="form-control" name="motivo" rows="2" maxlength="500" required
                                              placeholder="Explique por qué está modificando esta actividad"></textarea>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Tipo de actividad</label>
                                        <select class="form-select" name="tipoActividad" required>
                                            <option value="">Seleccione…</option>
                                            <option th:each="tipo : ${tiposActividad}"
                                                    th:value="${tipo}"
                                                    th:selected="${actividad != null and actividad.tipoActividad == tipo}"
                                                    th:text="${tipo}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Fecha de la actividad</label>
                                        <input type="date" class="form-control" name="fechaActividad"
                                               th:value="${actividad != null ? actividad.fechaActividad : hoy}" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Abonado relacionado (opcional)</label>
                                    <select class="form-select" name="idAbonado">
                                        <option value="">Ninguno / no aplica</option>
                                        <option th:each="ab : ${abonados}"
                                                th:value="${ab.idAbonado}"
                                                th:selected="${actividad != null and actividad.abonado != null and actividad.abonado.idAbonado == ab.idAbonado}"
                                                th:text="${ab.numeroAbonado + ' - ' + ab.nombre + ' ' + ab.apellidos}"></option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Descripción</label>
                                    <textarea class="form-control" name="descripcion" rows="3" maxlength="500" required
                                              th:text="${actividad != null ? actividad.descripcion : ''}"></textarea>
                                </div>

                                <div class="d-flex justify-content-between">
                                    <a href="/actividad/listado" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left"></i>
                                        Regresar
                                    </a>
                                    <button type="submit" class="btn btn-success">
                                        <i class="bi bi-check-lg"></i>
                                        Guardar
                                    </button>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>

        </div>

    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/main.js}"></script>

</body>

</html>
