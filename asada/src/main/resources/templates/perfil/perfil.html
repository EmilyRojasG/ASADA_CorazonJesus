<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi perfil | ASADA</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container py-4">

            <div th:replace="~{layout/mensajes :: mensajes}"></div>

            <h2 class="fw-bold mb-4">
                <i class="bi bi-person-circle text-primary"></i>
                Mi perfil
            </h2>

            <div class="row g-4">

                <div class="col-md-5">
                    <div class="card shadow-sm">
                        <div class="card-body text-center">

                            <img th:if="${usuario.rutaImagen != null}" th:src="@{${usuario.rutaImagen}}"
                                 alt="Foto de perfil" class="rounded-circle mb-3"
                                 style="width: 110px; height: 110px; object-fit: cover;">
                            <i th:if="${usuario.rutaImagen == null}" class="bi bi-person-circle text-secondary"
                               style="font-size: 7rem;"></i>

                            <h4 class="mt-2 mb-0" th:text="${usuario.nombre + ' ' + usuario.apellidos}"></h4>
                            <p class="text-muted mb-2">@<span th:text="${usuario.username}"></span></p>

                            <div>
                                <span class="badge bg-info text-dark me-1" th:each="rol : ${usuario.roles}" th:text="${rol.rol}"></span>
                            </div>

                            <hr>

                            <ul class="list-unstyled text-start mb-0">
                                <li class="mb-2">
                                    <i class="bi bi-envelope-fill text-muted"></i>
                                    <span th:text="${usuario.correo != null ? usuario.correo : 'Sin correo registrado'}"></span>
                                </li>
                                <li class="mb-2">
                                    <i class="bi bi-telephone-fill text-muted"></i>
                                    <span th:text="${usuario.telefono != null ? usuario.telefono : 'Sin teléfono registrado'}"></span>
                                </li>
                                <li>
                                    <i class="bi bi-circle-fill" th:classappend="${usuario.activo ? 'text-success' : 'text-secondary'}"></i>
                                    <span th:text="${usuario.activo ? 'Cuenta activa' : 'Cuenta inactiva'}"></span>
                                </li>
                            </ul>

                        </div>
                    </div>
                </div>

                <div class="col-md-7">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">
                                <i class="bi bi-key-fill"></i>
                                Cambiar mi contraseña
                            </h5>
                        </div>
                        <div class="card-body">

                            <form th:action="@{/perfil/cambiar-password}" method="post"
                                  onsubmit="return confirm('¿Confirma que desea cambiar su contraseña?');">

                                <div class="mb-3">
                                    <label class="form-label">Contraseña actual</label>
                                    <input type="password" class="form-control" name="passwordActual" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Nueva contraseña</label>
                                    <input type="password" class="form-control" name="passwordNueva" minlength="6" required>
                                    <div class="form-text">Mínimo 6 caracteres.</div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Confirmar nueva contraseña</label>
                                    <input type="password" class="form-control" name="passwordConfirmar" minlength="6" required>
                                </div>

                                <button type="submit" class="btn btn-success">
                                    <i class="bi bi-check-lg"></i>
                                    Actualizar contraseña
                                </button>

                            </form>

                        </div>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/main.js}"></script>

</body>

</html>
