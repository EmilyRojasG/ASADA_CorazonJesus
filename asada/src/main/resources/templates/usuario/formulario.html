<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Usuario | ASADA</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container py-4">

            <div th:replace="~{layout/mensajes :: mensajes}"></div>

                <div class="row justify-content-center">
                    <div class="col-md-7">

                        <div class="card shadow-sm">
                            <div class="card-header bg-primary text-white">
                                <h4 class="mb-0">
                                    <i class="bi bi-person-badge-fill"></i>
                                    <span th:text="${usuario.idUsuario != null ? 'Modificar usuario' : 'Nuevo usuario'}"></span>
                                </h4>
                            </div>
                            <div class="card-body">

                                <form th:action="@{/usuario/guardar}" th:object="${usuario}" method="post" enctype="multipart/form-data">

                                    <input type="hidden" th:field="*{idUsuario}">
                                    <input type="hidden" th:field="*{rutaImagen}">

                                    <div class="text-center mb-4">
                                        <img th:if="${usuario.rutaImagen != null}" th:src="@{${usuario.rutaImagen}}"
                                             alt="Foto actual" class="rounded-circle mb-2" style="width: 90px; height: 90px; object-fit: cover;">
                                        <i th:if="${usuario.rutaImagen == null}" class="bi bi-person-circle text-secondary" style="font-size: 5rem;"></i>
                                        <div>
                                            <label class="form-label small text-muted">Foto de perfil</label>
                                            <input type="file" name="imagenFile" accept="image/*" class="form-control form-control-sm">
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Nombre de usuario</label>
                                            <input type="text" class="form-control" th:field="*{username}"
                                                   th:classappend="${#fields.hasErrors('username') ? 'is-invalid' : ''}"
                                                   th:readonly="${usuario.idUsuario != null}"
                                                   maxlength="30" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">
                                                Contraseña
                                                <small class="text-muted" th:if="${usuario.idUsuario != null}">(dejar en blanco para no cambiarla)</small>
                                            </label>
                                            <input type="password" class="form-control" th:field="*{password}" maxlength="100" autocomplete="new-password">
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Nombre</label>
                                            <input type="text" class="form-control" th:field="*{nombre}"
                                                   th:classappend="${#fields.hasErrors('nombre') ? 'is-invalid' : ''}"
                                                   maxlength="20" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Apellidos</label>
                                            <input type="text" class="form-control" th:field="*{apellidos}"
                                                   th:classappend="${#fields.hasErrors('apellidos') ? 'is-invalid' : ''}"
                                                   maxlength="30" required>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Correo</label>
                                            <input type="email" class="form-control" th:field="*{correo}" maxlength="75">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Teléfono</label>
                                            <input type="text" class="form-control" th:field="*{telefono}" maxlength="25">
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label d-block">Roles</label>
                                        <div class="form-check form-check-inline" th:each="rol : ${todosLosRoles}">
                                            <input class="form-check-input" type="checkbox" name="idsRoles"
                                                   th:id="'rol' + ${rol.idRol}" th:value="${rol.idRol}"
                                                   th:checked="${idsRolesSeleccionados.contains(rol.idRol)}">
                                            <label class="form-check-label" th:for="'rol' + ${rol.idRol}" th:text="${rol.rol}"></label>
                                        </div>
                                    </div>

                                    <div class="form-check form-switch mb-4">
                                        <input class="form-check-input" type="checkbox" role="switch" th:field="*{activo}" id="activo">
                                        <label class="form-check-label" for="activo">Usuario activo</label>
                                    </div>

                                    <div class="d-flex justify-content-between">
                                        <a href="/usuario/listado" class="btn btn-outline-secondary">
                                            <i class="bi bi-arrow-left"></i>
                                            Regresar
                                        </a>
                                        <button type="submit" class="btn btn-success">
                                            <i class="bi bi-check-lg"></i>
                                            Guardar
                                        </button>
                                    </div>

                                </form>

                            </div>
                        </div>

                    </div>
                </div>

        </div>

    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/main.js}"></script>

</body>

</html>
