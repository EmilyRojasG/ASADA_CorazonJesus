<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Usuarios | ASADA</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container py-4">

            <div th:replace="~{layout/mensajes :: mensajes}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">
                        <i class="bi bi-person-badge-fill text-primary"></i>
                        Usuarios del sistema
                    </h2>
                    <a href="/usuario/nuevo" class="btn btn-primary" sec:authorize="hasRole('AGREGAR')">
                        <i class="bi bi-plus-lg"></i>
                        Nuevo usuario
                    </a>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">

                        <div th:if="${usuarios == null or usuarios.empty}" class="text-center text-muted py-4">
                            Todavía no hay usuarios registrados.
                        </div>

                        <div class="table-responsive" th:if="${usuarios != null and !usuarios.empty}">
                            <table class="table table-striped align-middle">
                                <thead>
                                    <tr>
                                        <th></th>
                                        <th>Usuario</th>
                                        <th>Nombre completo</th>
                                        <th>Correo</th>
                                        <th>Roles</th>
                                        <th>Estado</th>
                                        <th sec:authorize="hasAnyRole('EDITAR','ELIMINAR')"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="u : ${usuarios}">
                                        <td>
                                            <img th:with="rutaFoto=${u.rutaImagen != null ? u.rutaImagen : '/img/avatar-default.svg'}"
                                                 th:src="@{${rutaFoto}}"
                                                 alt="Foto" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
                                        </td>
                                        <td th:text="${u.username}"></td>
                                        <td th:text="${u.nombre + ' ' + u.apellidos}"></td>
                                        <td th:text="${u.correo}"></td>
                                        <td>
                                            <span class="badge bg-info text-dark me-1" th:each="rol : ${u.roles}" th:text="${rol.rol}"></span>
                                        </td>
                                        <td>
                                            <span class="badge" th:classappend="${u.activo ? 'bg-success' : 'bg-secondary'}"
                                                  th:text="${u.activo ? 'Activo' : 'Inactivo'}"></span>
                                        </td>
                                        <td class="text-end" sec:authorize="hasAnyRole('EDITAR','ELIMINAR')">
                                            <a th:href="@{/usuario/modificar/{id}(id=${u.idUsuario})}"
                                               class="btn btn-sm btn-outline-warning" sec:authorize="hasRole('EDITAR')">
                                                <i class="bi bi-pencil-fill"></i>
                                            </a>
                                            <button type="button" class="btn btn-sm btn-outline-danger" sec:authorize="hasRole('ELIMINAR')"
                                                    data-bs-toggle="modal"
                                                    th:data-bs-target="'#eliminarModal' + ${u.idUsuario}">
                                                <i class="bi bi-trash-fill"></i>
                                            </button>

                                            <div class="modal fade" th:id="'eliminarModal' + ${u.idUsuario}" tabindex="-1">
                                                <div class="modal-dialog">
                                                    <div class="modal-content">
                                                        <form th:action="@{/usuario/eliminar}" method="post">
                                                            <input type="hidden" name="idUsuario" th:value="${u.idUsuario}">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title">Confirmar eliminación</h5>
                                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                            </div>
                                                            <div class="modal-body">
                                                                ¿Desea eliminar al usuario <strong th:text="${u.username}"></strong>?
                                                                <p class="text-muted mt-2 mb-0">
                                                                    Si tiene lecturas registradas a su nombre, no podrá eliminarse;
                                                                    puede desactivarlo desde el formulario de edición.
                                                                </p>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                                                <button type="submit" class="btn btn-danger">Eliminar</button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>

        </div>

    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/main.js}"></script>

</body>

</html>
