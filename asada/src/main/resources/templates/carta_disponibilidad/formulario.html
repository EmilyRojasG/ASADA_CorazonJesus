<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nueva carta de disponibilidad | ASADA</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container py-4">

            <div th:replace="~{layout/mensajes :: mensajes}"></div>

            <div class="row justify-content-center">
                <div class="col-md-8">

                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">
                                <i class="bi bi-file-earmark-check-fill"></i>
                                Nueva carta de disponibilidad de agua
                            </h4>
                        </div>
                        <div class="card-body">

                            <p class="text-muted">
                                Complete los datos del solicitante y la propiedad. El sistema generará
                                automáticamente un número de carta correlativo y una versión lista para
                                imprimir o descargar como PDF.
                            </p>

                            <form th:action="@{/carta_disponibilidad/guardar}" method="post"
                                  onsubmit="return confirm('¿Confirma generar esta carta de disponibilidad?');">

                                <div class="row">
                                    <div class="col-md-8 mb-3">
                                        <label class="form-label">Nombre completo del solicitante</label>
                                        <input type="text" class="form-control" name="nombreSolicitante"
                                               maxlength="120" required>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Cédula</label>
                                        <input type="text" class="form-control" name="cedulaSolicitante"
                                               maxlength="25" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Dirección exacta de la propiedad</label>
                                    <textarea class="form-control" name="direccionPropiedad" rows="2"
                                              maxlength="255" required></textarea>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Número de finca (opcional)</label>
                                        <input type="text" class="form-control" name="numeroFinca" maxlength="25">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Plano catastrado (opcional)</label>
                                        <input type="text" class="form-control" name="planoCatastrado" maxlength="60"
                                               placeholder="Ej: SJ-1234567-2025">
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Observaciones (opcional)</label>
                                    <textarea class="form-control" name="observaciones" rows="2" maxlength="500"></textarea>
                                </div>

                                <div class="d-flex justify-content-between">
                                    <a href="/carta_disponibilidad/listado" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left"></i>
                                        Regresar
                                    </a>
                                    <button type="submit" class="btn btn-success">
                                        <i class="bi bi-file-earmark-check-fill"></i>
                                        Generar carta
                                    </button>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>

        </div>

    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/main.js}"></script>

</body>

</html>
