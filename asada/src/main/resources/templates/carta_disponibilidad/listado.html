<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cartas de disponibilidad | ASADA</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container py-4">

            <div th:replace="~{layout/mensajes :: mensajes}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">
                    <i class="bi bi-file-earmark-check-fill text-primary"></i>
                    Cartas de disponibilidad de agua
                </h2>
                <a href="/carta_disponibilidad/nueva" class="btn btn-primary" sec:authorize="hasRole('AGREGAR')">
                    <i class="bi bi-plus-lg"></i>
                    Nueva carta
                </a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">

                    <div th:if="${cartas == null or cartas.empty}" class="text-center text-muted py-4">
                        Todavía no se ha emitido ninguna carta de disponibilidad.
                    </div>

                    <div class="table-responsive" th:if="${cartas != null and !cartas.empty}">
                        <table class="table table-striped align-middle">
                            <thead>
                                <tr>
                                    <th>N.° de carta</th>
                                    <th>Solicitante</th>
                                    <th>Cédula</th>
                                    <th>Fecha de emisión</th>
                                    <th>Emitida por</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${cartas}">
                                    <td th:text="${c.numeroCarta}"></td>
                                    <td th:text="${c.nombreSolicitante}"></td>
                                    <td th:text="${c.cedulaSolicitante}"></td>
                                    <td th:text="${#temporals.format(c.fechaEmision, 'dd/MM/yyyy')}"></td>
                                    <td th:text="${c.usuario.nombre}"></td>
                                    <td class="text-end">
                                        <a th:href="@{/carta_disponibilidad/ver/{id}(id=${c.idCarta})}"
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-eye-fill"></i>
                                            Ver / Imprimir
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>

    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/main.js}"></script>

</body>

</html>
