<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Historial de lecturas | ASADA</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container py-4">

            <div th:replace="~{layout/mensajes :: mensajes}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">
                        <i class="bi bi-clock-history text-warning"></i>
                        Historial de lecturas
                    </h2>
                    <a href="/lectura/listado" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i>
                        Regresar
                    </a>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <small class="text-muted d-block">N.° de abonado</small>
                                <strong th:text="${abonado.numeroAbonado}"></strong>
                            </div>
                            <div class="col-md-5">
                                <small class="text-muted d-block">Nombre</small>
                                <strong th:text="${abonado.nombre + ' ' + abonado.apellidos}"></strong>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted d-block">Medidor</small>
                                <strong th:text="${abonado.numeroMedidor}"></strong>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted d-block">Categoría</small>
                                <strong th:text="${abonado.categoriaTarifa.descripcion}"></strong>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">

                        <div th:if="${lecturas == null or lecturas.empty}" class="text-center text-muted py-4">
                            Este abonado todavía no tiene lecturas registradas.
                        </div>

                        <div class="table-responsive" th:if="${lecturas != null and !lecturas.empty}">
                            <table class="table table-striped align-middle">
                                <thead>
                                    <tr>
                                        <th>Período</th>
                                        <th>Fecha</th>
                                        <th class="text-end">Lectura anterior</th>
                                        <th class="text-end">Lectura actual</th>
                                        <th class="text-end">Consumo (m³)</th>
                                        <th>Observaciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="l : ${lecturas}">
                                        <td th:text="${l.periodoMes + '/' + l.periodoAnio}"></td>
                                        <td th:text="${#temporals.format(l.fechaLectura, 'dd/MM/yyyy')}"></td>
                                        <td class="text-end" th:text="${#numbers.formatDecimal(l.lecturaAnterior, 1, 2)}"></td>
                                        <td class="text-end" th:text="${#numbers.formatDecimal(l.lecturaActual, 1, 2)}"></td>
                                        <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(l.consumo, 1, 2)}"></td>
                                        <td th:text="${l.observaciones}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>

        </div>

    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/main.js}"></script>

</body>

</html>
