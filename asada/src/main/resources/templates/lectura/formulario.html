<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar lectura | ASADA</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.7/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">

</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="flex-grow-1">

        <div class="container py-4">

            <div th:replace="~{layout/mensajes :: mensajes}"></div>

                <div class="row justify-content-center">
                    <div class="col-md-7">

                        <div class="card shadow-sm">
                            <div class="card-header bg-primary text-white">
                                <h4 class="mb-0">
                                    <i class="bi bi-speedometer2"></i>
                                    Registrar lectura
                                </h4>
                            </div>
                            <div class="card-body">

                                <form th:action="@{/lectura/guardar}" method="post" id="formLectura">

                                    <div class="mb-3">
                                        <label class="form-label">Abonado</label>
                                        <select class="form-select" name="idAbonado" id="idAbonado" required
                                                onchange="actualizarLecturaAnterior()">
                                            <option value="">Seleccione…</option>
                                            <option th:each="a : ${abonados}"
                                                    th:value="${a.idAbonado}"
                                                    th:attr="data-anterior=${ultimasLecturas.get(a.idAbonado)}"
                                                    th:text="${a.numeroAbonado + ' - ' + a.nombre + ' ' + a.apellidos}"></option>
                                        </select>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Año</label>
                                            <input type="number" class="form-control" name="periodoAnio" id="periodoAnio"
                                                   th:value="${hoy.year}" min="2000" max="2100" required>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Mes</label>
                                            <select class="form-select" name="periodoMes" id="periodoMes" required>
                                                <option value="1">Enero</option>
                                                <option value="2">Febrero</option>
                                                <option value="3">Marzo</option>
                                                <option value="4">Abril</option>
                                                <option value="5">Mayo</option>
                                                <option value="6">Junio</option>
                                                <option value="7">Julio</option>
                                                <option value="8">Agosto</option>
                                                <option value="9">Septiembre</option>
                                                <option value="10">Octubre</option>
                                                <option value="11">Noviembre</option>
                                                <option value="12">Diciembre</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Fecha de la lectura</label>
                                            <input type="date" class="form-control" name="fechaLectura"
                                                   th:value="${hoy}" required>
                                        </div>
                                    </div>

                                    <div class="row align-items-end">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Lectura anterior</label>
                                            <input type="text" class="form-control" id="lecturaAnteriorMostrada"
                                                   value="0.00" disabled>
                                            <div class="form-text">Se calcula automáticamente según el abonado seleccionado.</div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Lectura actual</label>
                                            <input type="number" step="0.01" min="0" class="form-control"
                                                   name="lecturaActual" id="lecturaActual" required>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label">Observaciones</label>
                                        <textarea class="form-control" name="observaciones" rows="2" maxlength="255"></textarea>
                                    </div>

                                    <div class="d-flex justify-content-between">
                                        <a href="/lectura/listado" class="btn btn-outline-secondary">
                                            <i class="bi bi-arrow-left"></i>
                                            Regresar
                                        </a>
                                        <button type="submit" class="btn btn-success">
                                            <i class="bi bi-check-lg"></i>
                                            Guardar
                                        </button>
                                    </div>

                                </form>

                            </div>
                        </div>

                    </div>
                </div>

                <script th:inline="javascript">
                    function actualizarLecturaAnterior() {
                        var select = document.getElementById('idAbonado');
                        var opcion = select.options[select.selectedIndex];
                        var anterior = opcion ? opcion.getAttribute('data-anterior') : null;
                        document.getElementById('lecturaAnteriorMostrada').value = anterior ? anterior : '0.00';
                        var actual = document.getElementById('lecturaActual');
                        if (anterior) {
                            actual.setAttribute('min', anterior);
                        }
                    }
                </script>

        </div>

    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

    <script src="/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/main.js}"></script>

</body>

</html>
